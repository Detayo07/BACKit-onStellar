[workspace]
resolver = "2"
members = [
  "backit_token",
  "call_registry",
  "charity_markets",
  "contracts/hello-world",
  "dutch_auction",
  "governance",
  "gas_station",
  "index_fund",
  "invariant_tests",
  "launchpad",
  "lending_pool",
  "oracle_marketplace",
  "outcome_manager",
  "parlay_betting",
  "prediction_market",
  "prediction_market_factory",
  "prediction_market_futures",
  "reputation_nft",
  "schelling_oracle",
  "shared",
  "tournament",
]

[workspace.dependencies]
soroban-sdk = "23.0.0"
backit-shared = { path = "shared" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
